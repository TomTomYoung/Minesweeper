<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインスイーパー (モード選択)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .mode-container {
            display: flex;
            gap: 40px;
        }

        .mode-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            border: 2px solid transparent;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
            border-color: #4CAF50;
        }

        .mode-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .mode-desc {
            color: #666;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn.rpg {
            background-color: #9C27B0;
        }
    </style>
</head>

<body>

    <h1>マインスイーパー モード選択</h1>

    <div class="mode-container">
        <a href="normal.html" class="mode-card">
            <div class="mode-title">通常モード</div>
            <div class="mode-desc">
                地雷を避けてマスを開ける<br>クラシックなマインスイーパー
            </div>
            <div class="btn">プレイ</div>
        </a>

        <a href="rpg.html" class="mode-card" style="border-color: #9C27B0;">
            <div class="mode-title" style="color: #9C27B0;">RPGモード</div>
            <div class="mode-desc">
                お宝を集め、階段を探して<br>深層を目指すエンドレスモード
            </div>
            <div class="btn rpg">冒険へ</div>
        </a>
    </div>

</body>

</html>
